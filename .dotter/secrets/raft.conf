# Raft Secrets
# Reference:
#   - https://github.com/botiverse/raft-source/blob/main/packages/server/.env.example
#
# postgres-password 来自共享 postgres，见 .dotter/secrets/postgres.conf。

# JWT 签名密钥：.env.example 要求 openssl rand -hex 32
raft-jwt-secret:hex:32

# server 运行时 DSN
raft-database-url:computed:postgresql://postgres:${postgres-password}@postgres:5432/raft

# 迁移专用 DSN。迁移预检是「读回校验」语义：SERVER_MIGRATION_EXPECTED_STATEMENT_TIMEOUT_MS
# 只是期望值，真正的 statement_timeout 必须由 DSN 的 options=-c 交付，两者必须相等。
# 允许范围 1000–3600000 ms（packages/server/src/db/migrationPreflight.ts）。
raft-migration-database-url:computed:postgresql://postgres:${postgres-password}@postgres:5432/raft?options=-c%20statement_timeout%3D600000

# S3（共享 silo）：附件桶凭据，bucket 与 policy 由 raft-s3-init 创建
raft-s3-access-key:hex:16
raft-s3-secret-key:hex:32
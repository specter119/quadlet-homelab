[helpers]
contains = ".dotter/helpers/contains.rhai"

[traefik.files]
traefik = '~/.config'

[traefik.files.'traefik/traefik']
target = '~/.config/traefik'
type = 'template'

[traefik.variables]
domain = "homelab.com"

[postgres.files]
postgres = '~/.config'

[garage.files]
garage = '~/.config'

[garage.files.'garage/garage']
target = '~/.config/garage'
type = 'template'

[silverbullet.files]
silverbullet = '~/.config'

[langfuse]
depends = ["postgres", "garage"]

[langfuse.files]
langfuse = '~/.config'

[dozzle.files]
dozzle = '~/.config'

[omnivore]
depends = ["postgres", "garage"]

[omnivore.files]
omnivore = '~/.config'

[plane]
depends = ["postgres", "garage"]

[plane.files]
plane = '~/.config'

[copyparty.files]
copyparty = '~/.config'

[marimo.files]
marimo = '~/.config'

[marimo.variables.marimo]
volumes = []

[multica]
depends = ["postgres"]

[multica.files]
multica = '~/.config'

[unsloth.files]
unsloth = '~/.config'

[unsloth.variables.unsloth]
volumes = []

[openfang.files]
openfang = '~/.config'

[openfang.variables.openfang]
volumes = []

[nowledge-mem.files]
nowledge-mem = '~/.config'

[excalidraw.files]
excalidraw = '~/.config'

[suwayomi.files]
suwayomi = '~/.config'

[lunatv.files]
lunatv = '~/.config'

[cliproxyapi.files]
cliproxyapi = '~/.config'

[qoder-proxy.files]
qoder-proxy = '~/.config'

[qoder-proxy.variables.qoder-proxy]
repo_overwrite = ""

[superset]
depends = ["postgres"]

[superset.files]
superset = '~/.config'
